name: Refresh profile signal
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    paths:
      - scripts/update_stats.py
      - .github/workflows/profile-refresh.yml
permissions:
  contents: write
concurrency:
  group: profile-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate cards from GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_USER: AmoghxAnubis
        run: python scripts/update_stats.py
      - name: Commit refreshed card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-signal.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh public profile signal"
            git push
          fi
